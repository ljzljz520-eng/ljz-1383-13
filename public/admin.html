<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技能证据图 · 管理控制台</title>
<link rel="stylesheet" href="css/skills.css">
<style>
  body { padding-bottom:60px; }
  .admin-wrap { max-width:1060px; margin:0 auto; padding:18px 20px; }
  .token-bar { display:flex; gap:8px; align-items:center; margin-bottom:14px; }
  .token-bar input { flex:1; background:#0b1426; border:1px solid var(--panel-border); color:var(--text); padding:8px 10px; border-radius:8px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .tab { padding:7px 13px; border-radius:8px; background:var(--panel); border:1px solid var(--panel-border); cursor:pointer; font-size:.85rem; }
  .tab.active { border-color:var(--accent); color:var(--accent); }
  .panel { background:var(--panel); border:1px solid var(--panel-border); border-radius:12px; padding:16px; margin-bottom:16px; }
  .panel h3 { font-size:.95rem; margin-bottom:10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  input,select,textarea { background:#0b1426; border:1px solid var(--panel-border); color:var(--text); padding:8px 10px; border-radius:8px; font-size:.85rem; }
  input.flex,select.flex { flex:1; min-width:140px; }
  table { width:100%; border-collapse:collapse; font-size:.8rem; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--panel-border); vertical-align:top; }
  .tag { font-size:.68rem; padding:1px 7px; border-radius:999px; background:rgba(148,163,184,.15); }
  .ok { color:var(--ok); } .warn{color:var(--warn);} .err{color:var(--danger);}
  .log { font-family:ui-monospace,monospace; font-size:.74rem; color:#a7f3d0; white-space:pre-wrap; max-height:180px; overflow:auto;
    background:rgba(2,6,23,.5); border:1px solid var(--panel-border); border-radius:8px; padding:8px; margin-top:8px; }
  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:820px){ .two-col{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><a href="skills.html">← 公开图</a><h1>技能证据图 · 管理控制台</h1></div>
</header>
<div class="admin-wrap">
  <div class="token-bar">
    <input id="token" placeholder="Owner Token（x-owner-token），演示默认 demo-owner-token">
    <button class="btn" id="saveToken">保存</button>
    <span id="tokenState" class="hint"></span>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="nodes">节点</div>
    <div class="tab" data-tab="edges">前置关系</div>
    <div class="tab" data-tab="evidence">证据</div>
    <div class="tab" data-tab="signals">自评 / 计划</div>
    <div class="tab" data-tab="merge">合并</div>
    <div class="tab" data-tab="rules">规则 / 作业</div>
    <div class="tab" data-tab="exports">导出</div>
  </div>

  <section class="panel" data-panel="nodes">
    <h3>新增节点</h3>
    <div class="row"><input class="flex" id="nTitle" placeholder="节点名称"><input class="flex" id="nDesc" placeholder="描述（可选）"><button class="btn" id="addNode">创建</button></div>
    <div id="nodeTable"></div>
  </section>

  <section class="panel" data-panel="edges" hidden>
    <h3>新增前置关系（parent 是 child 的前置；成环会被拒绝并返回环路径）</h3>
    <div class="row"><select class="flex" id="eParent"></select><select class="flex" id="eChild"></select><button class="btn" id="addEdge">添加前置</button></div>
    <div id="edgeTable"></div>
  </section>

  <section class="panel" data-panel="evidence" hidden>
    <h3>新增证据（可挂接多个技能节点）</h3>
    <div class="row">
      <input class="flex" id="evTitle" placeholder="证据标题">
      <select id="evKind"><option value="work">工作成果</option><option value="cert">证书</option><option value="artifact">作品</option><option value="assessment">外部测评</option></select>
      <input class="flex" id="evUrl" placeholder="可核验 URL">
      <input type="date" id="evTo" title="到期日（可选）">
      <label class="hint"><input type="checkbox" id="evPublic" checked> 公开</label>
    </div>
    <div class="row" id="evNodes"></div>
    <div class="row"><button class="btn" id="addEvidence">创建证据</button></div>
    <div id="evidenceTable"></div>
  </section>

  <section class="panel" data-panel="signals" hidden>
    <div class="two-col">
      <div>
        <h3>自评分（1–5，主观）</h3>
        <div class="row"><select class="flex" id="rNode"></select>
          <select id="rScore"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
          <label class="hint"><input type="checkbox" id="rPublic" checked> 公开</label>
          <button class="btn" id="addRating">添加</button></div>
        <div class="row"><input class="flex" id="rNote" placeholder="说明（可选）"></div>
      </div>
      <div>
        <h3>计划目标</h3>
        <div class="row"><select class="flex" id="pNode"></select><input class="flex" id="pTitle" placeholder="计划标题"><input type="date" id="pDate">
          <label class="hint"><input type="checkbox" id="pPublic" checked> 公开</label><button class="btn" id="addPlan">添加</button></div>
      </div>
    </div>
    <div id="signalsTable"></div>
  </section>

  <section class="panel" data-panel="merge" hidden>
    <h3>节点合并（source 并入 target：边/证据/自评/计划迁移，沿图重算）</h3>
    <div class="row"><select class="flex" id="mSource"></select><select class="flex" id="mTarget"></select><button class="btn" id="doMerge">合并</button></div>
  </section>

  <section class="panel" data-panel="rules" hidden>
    <h3>计算规则版本</h3>
    <div id="ruleList"></div>
    <div class="row">
      <button class="btn" data-activate="1.0.0">激活 v1.0.0（立即）</button>
      <button class="btn" data-activate="2.0.0">升级 v2.0.0（立即）</button>
      <button class="btn ghost" id="activateV2Late">升级 v2（延迟 3s，演示迟到作业）</button>
      <button class="btn ghost" id="enqueueRecomputeV1Delay">先入队一个延迟重算，再立刻升 v2（构造迟到作业）</button>
    </div>
    <h3 style="margin-top:14px">作业队列 / 维护</h3>
    <div class="row">
      <button class="btn" id="runJobs">执行到期作业 + 到期清扫</button>
      <button class="btn ghost" id="refreshJobs">刷新作业</button>
      <button class="btn ghost" id="recomputeAll">全量重算入队</button>
    </div>
    <div id="jobsTable"></div>
  </section>

  <section class="panel" data-panel="exports" hidden>
    <h3>历史图导出（冻结快照；私密证据只写脱敏占位）</h3>
    <div class="row"><input class="flex" id="expLabel" placeholder="导出标签，如：2026Q3 技能盘点"><button class="btn" id="createExport">创建导出</button></div>
    <div id="exportTable"></div>
  </section>

  <div class="log" id="log"></div>
</div>
<script src="js/admin.js"></script>
</body>
</html>
